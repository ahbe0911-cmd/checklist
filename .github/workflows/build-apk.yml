name: Build Native Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Kotlin Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Install supplied Persian font families
        run: |
          mkdir -p app/src/main/assets/fonts
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-Bold.ttf" -o app/src/main/assets/fonts/far_vazir.ttf
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/nadi1368/hris/c6a52b7ff837281639e9d5d70a468ef50cc791d7/src/assets/fonts/bundle/fonts/Far_Nazanin.ttf" -o app/src/main/assets/fonts/far_nazanin.ttf
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/MahmoodHashem/digital_book_reader/9f01097b9633202fc89aebcd48070023a0dc2106/assets/fonts/ARooznameh.ttf" -o app/src/main/assets/fonts/a_rooznameh.ttf
          test "$(git hash-object app/src/main/assets/fonts/far_vazir.ttf)" = "efa9b095da01d299310bdcae293e24e657fe6da9"
          test "$(git hash-object app/src/main/assets/fonts/far_nazanin.ttf)" = "5394a09545ac3274f1d24a3ff24777cac8baa584"
          test "$(git hash-object app/src/main/assets/fonts/a_rooznameh.ttf)" = "81c6269ddcbfef6b0f041dc2a55c3d2a396b19aa"

      - name: Build native APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: checklist-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
