name: Build Standalone Alarm APK

on:
  push:
    branches: [main, 'feature/standalone-alarm-*']
    paths:
      - 'alarm-standalone/**'
      - '.github/workflows/build-standalone-alarm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'alarm-standalone/**'
      - '.github/workflows/build-standalone-alarm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alarm:
    runs-on: ubuntu-latest
    name: Independent Android Alarm APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle Persian font
        run: |
          mkdir -p alarm-standalone/app/src/main/assets/fonts
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-Bold.ttf" -o alarm-standalone/app/src/main/assets/fonts/far_vazir.ttf
      - name: Compile standalone APK
        run: gradle --no-daemon -p alarm-standalone :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alarm-standalone-debug-apk
          path: alarm-standalone/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
