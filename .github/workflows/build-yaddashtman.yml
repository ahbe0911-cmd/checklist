name: Build YaddashtMan APK
on:
  push:
    branches: [yaddashtman-apk]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore web page
        run: |
          mkdir -p yaddashtman-android/app/src/main/assets
          base64 --decode yaddashtman-android/original-html.gz.b64 | gzip --decompress > yaddashtman-android/app/src/main/assets/index.html
          test -s yaddashtman-android/app/src/main/assets/index.html
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: yaddashtman-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YaddashtMan-debug-apk
          path: yaddashtman-android/app/build/outputs/apk/debug/app-debug.apk
